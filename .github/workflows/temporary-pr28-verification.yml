name: Temporary read-only PR snapshot verification

on:
  push:
    branches: [verify/pr28-bing-rss-images-20261125]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          package-manager-cache: false
      - name: Unit tests
        run: npm test
      - name: Collect public Google and Bing RSS
        run: npm run collect-news
      - name: Generate quality metrics
        run: npm run quality
      - name: Validate collected archive data
        run: npm run validate
      - name: Report source-specific RSS image signals
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const s=JSON.parse(fs.readFileSync('data/news-collection-status.json','utf8')); console.log(JSON.stringify({collectedAt:s.collectedAt,requestedQueries:s.requestedQueries,successfulQueries:s.successfulQueries,bingSuccessfulQueries:s.bingSuccessfulQueries,bingCandidates:s.bingCandidates,googleRssImageSignals:s.rssImageSignals,bingRssImageSignals:s.bingRssImageSignals,rssImageCandidateArticles:s.rssImageCandidateArticles,rssImageCandidatesTotal:s.rssImageCandidatesTotal,thumbnailEnrichment:s.thumbnailEnrichment},null,2));"
