name: Social-safe Bing RSS integration verification

on:
  push:
    branches:
      - integration/social-safe-bing-rss-20261126

permissions:
  contents: read

concurrency:
  group: social-safe-bing-rss-verification
  cancel-in-progress: false

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: npm test
      - name: Validate archive data
        run: npm run validate
