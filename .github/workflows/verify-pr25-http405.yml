name: PR25 HTTP 405 regression verification

on:
  push:
    branches:
      - verify/pr25-http405-b152ebc4

permissions:
  contents: read

concurrency:
  group: pr25-http405-verification
  cancel-in-progress: false

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout verification snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: npm test
      - name: Validate archive data
        run: npm run validate
