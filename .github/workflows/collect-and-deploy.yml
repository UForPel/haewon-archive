name: Collect and deploy archive

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '*.md'
  schedule:
    - cron: "17 23 * * *"
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Prevent overlapping collectors from racing while committing refreshed data.
concurrency:
  group: haewon-archive-pages
  cancel-in-progress: false

jobs:
  verify-collect-deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Record workflow start time
        run: echo "RUN_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Test, collect once, validate and commit refreshed data
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          RUN_STARTED_AT: ${{ env.RUN_STARTED_AT }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          set -euo pipefail
          # Normally one pass. Re-run only if main advances while this job is pushing.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            echo "Production cycle attempt $attempt"
            npm test
            npm run collect
            npm run collect-youtube-search
            npm run collect-news
            npm run sync-discovery-videos
            npm run improve
            npm run quality
            npm run validate
            npm run log
            npm run validate
            if [[ -z "$(git status --porcelain data/)" ]]; then
              echo "No data changes to commit."
              exit 0
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "data: refresh archive discovery and improvement cycle"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push race on attempt $attempt; refreshing from latest main and repeating the cycle."
            sleep 2
          done
          echo "::error::Push failed after 3 complete test-and-collection attempts."
          exit 1
      - name: Check whether GitHub Pages is configured
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Pages is not configured yet. Set Settings > Pages > Source to GitHub Actions, then rerun this workflow."
          fi
      - name: Configure Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload Pages artifact
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages
          path: .
      - name: Wait for Pages artifact metadata
        if: steps.pages.outputs.enabled == 'true'
        run: sleep 10
      - name: Deploy to GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages
