name: Collect and deploy archive

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 23 * * *"
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: haewon-archive-pages
  cancel-in-progress: false

jobs:
  verify-collect-deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: npm test
      - name: Collect public YouTube feed
        run: npm run collect
      - name: Validate archive data
        run: npm run validate
      - name: Commit collected data
        run: |
          if [[ -n "$(git status --porcelain data/)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "data: refresh official NMIXX video feed"
            git push
          else
            echo "No data changes to commit."
          fi
      - name: Check whether GitHub Pages is configured
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Pages is not configured yet. Set Settings > Pages > Source to GitHub Actions, then rerun this workflow."
          fi
      - name: Configure Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
